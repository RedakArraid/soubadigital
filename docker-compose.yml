services:
  web:
    build: ./web
    ports:
      - "8090:3000"
    environment:
      - API_BASE_INTERNAL=http://admin:3000
      - NEXT_PUBLIC_API_BASE=http://localhost:8091
    depends_on:
      - admin
    restart: unless-stopped

  admin:
    build: ./server
    ports:
      - "8091:3000"
    env_file:
      - .env
    environment:
      - ADMIN_DIR=/app/admin
      - ASSETS_DIR=/app/assets
      - DATA_DIR=/app/data
    volumes:
      - ./data:/app/data
      - ./admin:/app/admin:ro
      - ./assets:/app/assets:ro
    restart: unless-stopped
