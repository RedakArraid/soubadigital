services:
  web:
    build: ./web
    ports:
      - "8090:3000"
    environment:
      - API_BASE_INTERNAL=http://admin:3000
      - NEXT_PUBLIC_API_BASE=http://localhost:8091
    depends_on:
      - admin
    restart: unless-stopped

  admin:
    build: ./server
    ports:
      - "8091:3000"
    env_file:
      - .env
    environment:
      - ADMIN_DIR=/app/admin
      - ASSETS_DIR=/app/assets
      - DATA_DIR=/app/data
    volumes:
      - ./data:/app/data
      - ./admin:/app/admin:ro
      - ./assets:/app/assets:ro
    restart: unless-stopped

  stirling-pdf:
    image: docker.stirlingpdf.com/stirlingtools/stirling-pdf:latest
    ports:
      - "8092:8080"
    env_file:
      - .env
    environment:
      SYSTEM_ROOTURIPATH: /pdf
      SYSTEM_FRONTENDURL: http://localhost:8092/pdf
      SECURITY_ENABLELOGIN: "false"
      SECURITY_XFRAMEOPTIONS: SAMEORIGIN
      STORAGE_ENABLED: "false"
      STORAGE_SIGNING_ENABLED: "false"
      SYSTEM_DEFAULTLOCALE: fr-FR
      SYSTEM_MAXFILESIZE: "100"
      UI_APPNAME: SOUBA PDF
      UI_HOMEDESCRIPTION: Outils PDF — SOUBA Digital
      DISABLE_ADDITIONAL_FEATURES: "false"
      METRICS_ENABLED: "false"
    volumes:
      - ./data/stirling/configs:/configs
      - ./data/stirling/tessdata:/usr/share/tessdata
      - ./data/stirling/logs:/logs
      - ./data/stirling/pipeline:/pipeline
      - ./data/stirling/customFiles:/customFiles
      - ./data/stirling/storage:/storage
    restart: unless-stopped
