services:
  web:
    build: ./web
    container_name: soubadigital-web
    restart: unless-stopped
    environment:
      - API_BASE_INTERNAL=http://admin:3000
      - NEXT_PUBLIC_API_BASE=https://admin.soubadigital.com
    depends_on:
      - admin
    networks:
      - traefik_network
    labels:
      - traefik.enable=true
      - traefik.http.routers.soubadigital.rule=Host(`soubadigital.com`) || Host(`www.soubadigital.com`)
      - traefik.http.routers.soubadigital.entrypoints=websecure
      - traefik.http.routers.soubadigital.tls=true
      - traefik.http.routers.soubadigital.tls.certresolver=mytlschallenge
      - traefik.http.services.soubadigital.loadbalancer.server.port=3000
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3

  admin:
    build: ./server
    container_name: soubadigital-admin
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - ADMIN_DIR=/app/admin
      - ASSETS_DIR=/app/assets
      - DATA_DIR=/app/data
      - ADMIN_PUBLIC_URL=https://admin.soubadigital.com
      - NODE_ENV=production
    volumes:
      - ./data:/app/data
      - ./admin:/app/admin:ro
      - ./assets:/app/assets:ro
    networks:
      - traefik_network
    labels:
      - traefik.enable=true
      - traefik.http.routers.soubadigital-admin.rule=Host(`admin.soubadigital.com`) && !PathPrefix(`/pdf`)
      - traefik.http.routers.soubadigital-admin.priority=50
      - traefik.http.routers.soubadigital-admin.entrypoints=websecure
      - traefik.http.routers.soubadigital-admin.tls=true
      - traefik.http.routers.soubadigital-admin.tls.certresolver=mytlschallenge
      - traefik.http.services.soubadigital-admin.loadbalancer.server.port=3000
      # Stubs Stirling (wau 403 / policies 404) — priorité > route /pdf
      - traefik.http.routers.soubadigital-pdf-wau.rule=Host(`admin.soubadigital.com`) && Path(`/pdf/api/v1/info/wau`)
      - traefik.http.routers.soubadigital-pdf-wau.priority=120
      - traefik.http.routers.soubadigital-pdf-wau.entrypoints=websecure
      - traefik.http.routers.soubadigital-pdf-wau.tls=true
      - traefik.http.routers.soubadigital-pdf-wau.tls.certresolver=mytlschallenge
      - traefik.http.routers.soubadigital-pdf-wau.service=soubadigital-admin
      - traefik.http.routers.soubadigital-pdf-policies.rule=Host(`admin.soubadigital.com`) && PathPrefix(`/pdf/api/v1/policies`)
      - traefik.http.routers.soubadigital-pdf-policies.priority=120
      - traefik.http.routers.soubadigital-pdf-policies.entrypoints=websecure
      - traefik.http.routers.soubadigital-pdf-policies.tls=true
      - traefik.http.routers.soubadigital-pdf-policies.tls.certresolver=mytlschallenge
      - traefik.http.routers.soubadigital-pdf-policies.service=soubadigital-admin
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  stirling-pdf:
    build:
      context: ./stirling
      dockerfile: Dockerfile
    image: soubadigital-stirling-pdf:local
    container_name: soubadigital-pdf
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SYSTEM_ROOTURIPATH: /pdf
      SYSTEM_FRONTENDURL: https://admin.soubadigital.com/pdf
      # Login Stirling OFF : sous /pdf le chemin relatif ./assets casse /pdf/login (404).
      # L'accès reste protégé par le cookie admin Souba (Traefik ForwardAuth).
      SECURITY_ENABLELOGIN: "false"
      SECURITY_XFRAMEOPTIONS: SAMEORIGIN
      STORAGE_ENABLED: "false"
      STORAGE_SIGNING_ENABLED: "false"
      SYSTEM_DEFAULTLOCALE: fr-FR
      SYSTEM_MAXFILESIZE: "100"
      UI_APPNAME: SOUBA PDF
      UI_HOMEDESCRIPTION: Outils PDF — SOUBA Digital
      DISABLE_ADDITIONAL_FEATURES: "false"
      METRICS_ENABLED: "false"
    volumes:
      - ./data/stirling/configs:/configs
      - ./data/stirling/tessdata:/usr/share/tessdata
      - ./data/stirling/logs:/logs
      - ./data/stirling/pipeline:/pipeline
      - ./data/stirling/customFiles:/customFiles
      - ./data/stirling/storage:/storage
    networks:
      - traefik_network
    labels:
      - traefik.enable=true
      - traefik.http.middlewares.souba-pdf-auth.forwardauth.address=http://admin:3000/api/auth/forward
      - traefik.http.middlewares.souba-pdf-auth.forwardauth.trustForwardHeader=true
      - traefik.http.middlewares.souba-pdf-auth.forwardauth.authResponseHeaders=X-Forwarded-User
      - traefik.http.routers.soubadigital-pdf.rule=Host(`admin.soubadigital.com`) && PathPrefix(`/pdf`)
      - traefik.http.routers.soubadigital-pdf.priority=100
      - traefik.http.routers.soubadigital-pdf.entrypoints=websecure
      - traefik.http.routers.soubadigital-pdf.tls=true
      - traefik.http.routers.soubadigital-pdf.tls.certresolver=mytlschallenge
      - traefik.http.routers.soubadigital-pdf.middlewares=souba-pdf-auth
      - traefik.http.services.soubadigital-pdf.loadbalancer.server.port=8080
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8080/pdf/api/v1/info/status | grep -q UP || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 90s

networks:
  traefik_network:
    external: true
